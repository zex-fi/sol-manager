[package]
name = "zex_asset_manger"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_manager"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
solana-program = "2.2.1" # needed for struct Ed25519SignatureOffsets
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
bs58 = "0.5.1"
bytemuck = "1.22.0"