[toolchain]
package_manager = "yarn"
anchor_version = "0.31.0"
solana_version = "2.1.18"

[features]
resolution = true
skip-lint = true
seeds = false
skip-build-docker-image = true  # ✅ Add this line

[workspace]
members = ["programs/sol-manager"]

[programs.localnet]
sol_manager = "CVtFHhvpcXSxAhcmkwtSozQogJonYMZoC9m4BjB1pm3u"

[registry]
url = "https://api.apr.dev"

[provider]
#cluster = "https://api.devnet.solana.com"
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
