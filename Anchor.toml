[toolchain]
anchor_version = "0.31.0"
solana_version = "2.1.18"
package_manager = "yarn"

[features]
resolution = true
skip-lint = true

[programs.localnet]
sol_manager = "AjhejxyRBm2TvENEsaxCbmiJj3sMc6W5JnxLMDKvaZRn"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/sol-manager"]

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.test.ts"
